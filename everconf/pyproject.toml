[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "everconf"
version = "0.1.0"
description = "A value that carries how much you can trust it — confidence-tracked numbers for Python, extracted from the Ever language."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Ricky (Dreid), Codric Enterprise" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Development Status :: 4 - Beta",
]

[project.urls]
Homepage = "https://github.com/codric/tapestry"

[tool.setuptools]
packages = ["everconf"]
