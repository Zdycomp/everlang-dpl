# Ever / Tapestry — services
# Codric Enterprise · Ricky (Dreid) · 2026

services:

  # Verify every layer. This is the one that finally covers Ruby and
  # Java, which the bare build container could not.
  verify:
    build: .
    image: codric/ever:2.3
    command: ./run.sh
    volumes:
      - ./archive:/ever/archive

  # The self-generating loop.
  evolve:
    build: .
    image: codric/ever:2.3
    command: python3 2-interpreter-python/vowels.py
    volumes:
      - ./archive:/ever/archive

  # The research team: conservation law, ratios, defect profile.
  research:
    build: .
    image: codric/ever:2.3
    command: python3 research.py

  # Write and run Ever interactively.
  shell:
    build: .
    image: codric/ever:2.3
    command: /bin/bash
    stdin_open: true
    tty: true
    volumes:
      - .:/ever

  # The live interpreter, in a browser.
  live:
    build: .
    image: codric/ever:2.3
    command: python3 -m http.server 8088 --directory 6-interface-html
    ports:
      - "8088:8088"
